# BİR KEZ elle çalıştırılır (Actions > ios-signing-setup > Run workflow).
# fastlane match ile Apple dağıtım sertifikasını ve uygulama + widget
# profillerini oluşturup gizli sertifika reposuna (şifreli) koyar.
# Sonraki TestFlight derlemeleri bunları yalnızca OKUR.
name: ios-signing-setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Gizli ayarlar tanımlı mı?
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          missing=0
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 MATCH_PASSWORD MATCH_GIT_URL; do
            if [ -z "${!v}" ]; then echo "::error::GitHub Secret eksik: $v"; missing=1; fi
          done
          exit $missing

      - name: fastlane match (sertifika + profiller)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: bundle exec fastlane ios certificates
