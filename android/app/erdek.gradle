// Erdek Rehberi'ne özel Android ayarları. scripts/setup_android.sh, Flutter'ın ürettiği
// app/build.gradle.kts dosyasının sonuna `apply(from = "erdek.gradle")` ekler; böylece
// Gradle/AGP sürümleri her zaman kurulu Flutter'ınkiyle uyumlu kalır.

def env = System.getenv()
def hasUploadKey = env.ANDROID_KEYSTORE_PATH && new File(env.ANDROID_KEYSTORE_PATH).exists()

android {
    namespace = "com.erdek.sehirrehberi.erdekrehberi"
    // Eklentiler (flutter_local_notifications, androidx.core) en az 37 istiyor; geriye uyumlu.
    compileSdk = 37

    defaultConfig {
        applicationId = "com.erdek.sehirrehberi.erdekrehberi"
        minSdk = 24
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
    }

    signingConfigs {
        if (hasUploadKey) {
            upload {
                storeFile = file(env.ANDROID_KEYSTORE_PATH)
                storePassword = env.ANDROID_KEYSTORE_PASSWORD
                keyAlias = env.ANDROID_KEY_ALIAS
                keyPassword = env.ANDROID_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            // Yükleme anahtarı yoksa hata ayıklama anahtarıyla imzalanır (yalnızca deneme APK'sı).
            signingConfig = hasUploadKey ? signingConfigs.upload : signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation "org.osmdroid:osmdroid-android:6.1.20"
}
