name: erdek_rehberi
description: >-
  Erdek Şehir Rehberi — nöbetçi eczane, namaz vakitleri, ulaşım, önemli
  telefonlar, duyurular ve hava durumu. Bağımsız, resmi olmayan uygulama.
publish_to: none

# Build numarası (+N) CI'da GITHUB_RUN_NUMBER ile ezilir.
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  # CI'daki Flutter sürümü BURADAN okunur (subosito/flutter-action
  # flutter-version-file). Sürümü yükseltmek için yalnızca burayı değiştir.
  flutter: 3.50.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # Flutter 3.50'den itibaren Material, SDK dışında ayrı paket.
  material_ui: ^1.0.0
  flutter_riverpod: ^3.0.0
  dio: ^5.7.0
  hive_ce_flutter: ^2.5.0
  timezone: ^0.11.2
  phosphoricons_flutter: ^1.1.1
  url_launcher: ^6.3.0
  flutter_local_notifications: ^23.0.3
  # Diğer paketler (supabase_flutter, home_widget ...)
  # ilgili adımlarda eklenecek; kullanılmayan bağımlılık eklemiyoruz.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Uygulamayla birlikte gelen veri kopyası: ilk açılışta internet yoksa
    # bunlar gösterilir. (Yalnızca data/ kökündeki dosyalar; schemas/ dahil değil.)
    - data/
    - assets/images/

  # Poppins — SIL Open Font License (assets/fonts/OFL-Poppins.txt)
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
